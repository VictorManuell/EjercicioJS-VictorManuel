<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeApi - Executive Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-secondary bg-opacity-10">
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
      <div class="container justify-content-center">
        <span class="navbar-brand mb-0 h1 fw-bold tracking-wide"
          >⚡ PokeAPI ⚡</span
        >
      </div>
    </nav>

    <div class="container pb-5">
      <div class="row justify-content-center mb-4">
        <div class="col-md-7">
          <div class="card shadow border-0 p-3 bg-white rounded-3">
            <label
              for="idPokemon"
              class="form-label text-muted small fw-bold mb-2"
              >BUSCANDO INTEGRANTES</label
            >
            <div class="input-group">
              <input
                type="text"
                id="idPokemon"
                class="form-control border-secondary border-opacity-25"
                placeholder="Escribe id o nombrede un pokemon..."
              />
              <button class="btn btn-dark px-4" id="btnSearch">
                Encontrar
              </button>
              <button id="btnRandom" class="btn btn-outline-secondary">
                Aleatorio
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center mb-5" id="card-Container-pokemon">
        <div class="col-md-4 text-center text-muted py-3"></div>
      </div>

      <!-- Tabla  -->
      <div class="card shadow border-0 p-4 bg-white rounded-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="text-secondary fw-bold m-0 fs-5">Mi Equipo Pokemon</h4>
          <span class="badge bg-dark">Límite: 6</span>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle text-center mb-0">
            <thead class="table-dark text-uppercase fs-7">
              <tr>
                <th class="py-3">Imagen</th>
                <th class="py-3">Nombre</th>
                <th class="py-3">Tipo</th>
                <th class="py-3">Habilidades</th>
                <th class="py-3">Experiencia</th>
              </tr>
            </thead>
            <tbody id="TableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Conectar con el JS -->
    <script src="main.js"></script>
  </body>
</html>
